name: ocp-bottleneck-analyzer

on:
  push:
    branches: [main]
    paths: ["projects/ocp-bottleneck-analyzer/**", ".github/workflows/ocp-bottleneck-analyzer.yml"]
  pull_request:
    paths: ["projects/ocp-bottleneck-analyzer/**", ".github/workflows/ocp-bottleneck-analyzer.yml"]

defaults:
  run:
    working-directory: projects/ocp-bottleneck-analyzer

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
