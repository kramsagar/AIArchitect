[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ocp-bottleneck-analyzer"
version = "0.1.0"
description = "AIOps + agentic root-cause analysis of OpenShift deployment bottlenecks (infra, logs, Prometheus metrics)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "requests>=2.31",
  "pydantic>=2.5",
  "openai>=1.30",
  "typer>=0.12",
]

[project.optional-dependencies]
ui = ["streamlit>=1.48", "plotly>=5.20", "pandas>=2.0"]
dev = ["pytest>=8", "responses>=0.25", "ruff>=0.5", "streamlit>=1.48", "plotly>=5.20", "pandas>=2.0"]

[project.scripts]
ocp-analyzer = "ocp_analyzer.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]
