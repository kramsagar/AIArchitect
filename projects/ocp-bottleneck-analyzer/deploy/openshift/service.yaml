apiVersion: v1
kind: Service
metadata:
  name: ocp-bottleneck-analyzer
  annotations:
    # service-ca issues the proxy's TLS cert; the reencrypt Route trusts it automatically.
    service.beta.openshift.io/serving-cert-secret-name: ocp-bottleneck-analyzer-tls
spec:
  selector:
    app: ocp-bottleneck-analyzer
  ports:
    # Only the authenticating proxy is exposed; Streamlit listens on localhost inside the pod.
    - name: https
      port: 8443
      targetPort: https
