apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: ocp-bottleneck-analyzer
  annotations:
    # Streamlit uses websockets; keep long-lived connections open.
    haproxy.router.openshift.io/timeout: 1h
spec:
  to:
    kind: Service
    name: ocp-bottleneck-analyzer
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
