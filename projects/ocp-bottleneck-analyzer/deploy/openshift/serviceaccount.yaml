apiVersion: v1
kind: ServiceAccount
metadata:
  name: ocp-bottleneck-analyzer
  annotations:
    # Lets the oauth-proxy sidecar use this SA as an OAuth client redirecting back to the Route.
    serviceaccounts.openshift.io/oauth-redirectreference.primary: >-
      {"kind":"OAuthRedirectReference","apiVersion":"v1","reference":{"kind":"Route","name":"ocp-bottleneck-analyzer"}}
