[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "m05-a2a"
version = "0.1.0"
description = "Module 5 - the M4 incident crew split into independently deployed A2A agents: agent cards, discovery, tasks, artifacts, auth, trace propagation."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "m04-crew",    # pip install -e ../m04-multi-agent (and its m01/m02/m03 deps)
  "a2a-sdk[http-server]>=1.3,<2",
  "uvicorn>=0.30",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
m05 = "m05_a2a.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
