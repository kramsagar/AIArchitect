[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "m02-obs"
version = "0.1.0"
description = "Module 2 - real tools, RAG fundamentals, memory and MCP over the ShopSphere observability lab."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "m01-agent",            # reuses M1's resilience primitives and Claude adapter: pip install -e ../m01-llm-agent-engineering
  "pydantic>=2.5",
  "httpx>=0.27",
  "mcp>=1.25,<2",
]

[project.optional-dependencies]
embeddings = ["sentence-transformers>=3.0"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
m02 = "m02_obs.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
m02_obs = ["corpus/*.md"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/m02_obs/backends/fixtures.py" = ["E501"]  # scripted incident data reads best one record per line

[tool.pytest.ini_options]
testpaths = ["tests"]
