[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "m04-crew"
version = "0.1.0"
description = "Module 4 - multi-agent incident-response crew on LangGraph: triage, parallel investigators, RCA, planner, human approval, executor, verifier, postmortem; checkpointed and resumable."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "m01-agent",   # pip install -e ../m01-llm-agent-engineering
  "m02-obs",     # pip install -e ../m02-rag-memory-mcp   (Prometheus / Jaeger / Splunk / chaos backends)
  "m03-rag",     # pip install -e ../m03-agentic-rag      (hybrid runbook retrieval)
  "langgraph>=1.0,<2",
  "langgraph-checkpoint-sqlite>=2",
  "httpx>=0.27",
  "pydantic>=2.5",
]

[project.optional-dependencies]
postgres = ["langgraph-checkpoint-postgres>=2", "psycopg[binary]>=3.1"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
m04 = "m04_crew.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
